name: CodeQL
on:
  push:
    branches: [master, staging, dev, js/dev]
  pull_request:
    branches: [master, staging, dev, js/dev]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check cmake==3.31.6
      - uses: ./.github/actions/setup-dockpipe
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - run: dockpipe --workflow core.build
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
