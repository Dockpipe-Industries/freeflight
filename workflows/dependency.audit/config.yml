name: dependency.audit
description: Query official dependency vulnerability feeds for the locked worker graphs.
vault: none
docker_preflight: false
steps:
  - id: npm
    kind: host
    cwd: repo
    cmd: npm audit --prefix bin/.local/typescript --omit=dev --audit-level=high
  - id: nuget
    kind: host
    cwd: repo
    cmd: dotnet list workers/roslyn/FreeFlight.Roslyn.csproj package --vulnerable --include-transitive --format json
