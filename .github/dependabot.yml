version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      codeql-actions:
        patterns:
          - github/codeql-action/*
  - package-ecosystem: npm
    directory: /workers/typescript
    schedule:
      interval: weekly
    target-branch: dev
  - package-ecosystem: nuget
    directory: /workers/roslyn
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      roslyn-workspaces:
        patterns:
          - Microsoft.CodeAnalysis.*
