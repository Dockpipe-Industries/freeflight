name: core.jammy
description: Build the separately qualified Ubuntu 22.04 preview using the pinned runner GCC 12.3.0 toolchain.
vault: none
docker_preflight: false
steps:
  - id: compiler
    kind: host
    cwd: repo
    cmd: python3 -c "import subprocess; assert subprocess.check_output(['/usr/bin/g++-12', '-dumpfullversion'], text=True).strip() == '12.3.0', 'GCC 12.3.0 required'"
  - id: build
    kind: host
    cwd: repo
    cmd: cmake -E env CXX=/usr/bin/g++-12 dockpipe --workflow core.build
