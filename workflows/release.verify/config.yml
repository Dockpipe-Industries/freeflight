name: release.verify
description: Verify hosted qualification, promotion ancestry and complete native release bytes; never publishes.
vault: none
docker_preflight: false
steps:
  - id: policy-tests
    kind: host
    cwd: repo
    cmd: python3 -B workflows/release.verify/assets/test_policy.py
  - id: candidate
    kind: host
    cwd: repo
    cmd: python3 -B workflows/release.verify/assets/policy.py
