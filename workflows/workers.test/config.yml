name: workers.test
description: Compose FreeFlight workers.test workflows.
vault: none
docker_preflight: false
steps:
  - id: workers.typescript
    kind: host
    cwd: repo
    cmd: dockpipe --workflow workers.typescript
  - id: workers.roslyn
    kind: host
    cwd: repo
    cmd: dockpipe --workflow workers.roslyn
