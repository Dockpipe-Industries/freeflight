name: site.test
description: Render the Qt WebAssembly site in task-local Chromium and verify responsive output.
vault: none
docker_preflight: false
steps:
  - id: source-documents
    kind: host
    cwd: repo
    cmd: python3 -B -m unittest discover -s workflows/site.build/assets -p test_documents.py
  - id: browser-smoke
    kind: host
    cwd: repo
    cmd: python3 -B workflows/site.test/assets/test.py
