name: package.jammy
description: Verify already qualified native archives against Ubuntu 22.04 ABI limits and a clean runtime container; never publish.
vault: none
docker_preflight: false
steps:
  - id: policy
    kind: host
    cwd: repo
    cmd: python3 -B workflows/package.jammy/assets/test_check.py
  - id: compatibility
    kind: host
    cwd: repo
    cmd: python3 -B workflows/package.jammy/assets/check.py
