name: check
description: Compose FreeFlight check workflows.
vault: none
docker_preflight: false
steps:
  - id: repo.check
    kind: host
    cwd: repo
    cmd: dockpipe --workflow repo.check
  - id: test
    kind: host
    cwd: repo
    cmd: dockpipe --workflow test
  - id: lint
    kind: host
    cwd: repo
    cmd: dockpipe --workflow lint
  - id: dependency.audit
    kind: host
    cwd: repo
    cmd: dockpipe --workflow dependency.audit
  - id: registry.check
    kind: host
    cwd: repo
    cmd: dockpipe --workflow registry.check
