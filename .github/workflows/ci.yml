name: CI
on:
  pull_request:
    branches: [master, staging, dev, js/dev]
  # Implementation is pushed to js/dev. Protected-branch PRs validate promotion proposals.
  push:
    branches: [js/dev]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: freeflight-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/master' }}
jobs:
  promotion-policy:
    name: Promotion policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-dockpipe
      - name: Check protected-branch promotion source
        run: dockpipe --workflow promotion.check
  qualify:
    needs: promotion-policy
    name: Qualify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, ubuntu-24.04-arm, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/bin/.local/nuget
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - name: Select macOS C++23 toolchain
        if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun clang++ --version
      - name: Provision native build frontend
        run: python -m pip install --disable-pip-version-check cmake==3.31.6 jsonschema==4.25.1 PyYAML==6.0.2 clang-format==20.1.8
      - uses: ./.github/actions/setup-dockpipe
      - name: Repository health
        run: dockpipe --workflow repo.check
      - name: Development lifecycle policy
        run: dockpipe --workflow development.test
      - name: Release and publication policy
        run: dockpipe --workflow release.policy
      - name: C++23 build
        run: dockpipe --workflow ${{ matrix.os == 'ubuntu-22.04' && 'core.jammy' || 'core.build' }}
      - name: Formatting
        run: dockpipe --workflow lint
      - name: Core protocol and process tests
        run: dockpipe --workflow core.test
      - name: TypeScript worker qualification
        run: dockpipe --workflow workers.typescript
      - name: Roslyn worker qualification
        run: dockpipe --workflow workers.roslyn
      - name: Cross-engine MCP integration
        run: dockpipe --workflow integration.test
      - name: Real repository semantics
        run: dockpipe --workflow integration.real
      - name: Legacy .NET Framework project semantics
        if: runner.os == 'Windows'
        run: dockpipe --workflow legacy.dotnet
      - name: Independent official MCP client
        run: dockpipe --workflow mcp.compatibility
      - name: Dependency vulnerability checks
        run: dockpipe --workflow dependency.audit
      - name: Official MCP Registry metadata
        run: dockpipe --workflow registry.check
      - uses: ./.github/actions/setup-native-inputs
      - name: Complete native bundle and installed semantic verification
        run: dockpipe --workflow package.native
      - name: Clean Ubuntu 22.04 runtime qualification
        if: matrix.os == 'ubuntu-22.04'
        run: dockpipe --workflow package.jammy
      - name: Retain qualified native bundles
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os == 'ubuntu-22.04' && 'preview-ubuntu-22.04-linux-x64' || format('native-{0}', matrix.os) }}
          path: |
            bin/.local/packages/
            bin/.local/jammy-compatibility.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualification-${{ matrix.os }}
          path: |
            bin/.local/build/Testing/Temporary/LastTest.log
            bin/.local/reports/legacy-net*.json
          if-no-files-found: warn
          retention-days: 14
  site:
    needs: promotion-policy
    name: Qt WebAssembly site (${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    env:
      FREEFLIGHT_SITE_ENV: ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Provision build frontend
        run: python -m pip install --disable-pip-version-check cmake==3.31.6 PyYAML==6.0.2
      - uses: ./.github/actions/setup-dockpipe
      - name: Provision pinned public Qt and Emscripten SDKs
        run: dockpipe --workflow site.toolchain
      - name: Collect corresponding Qt sources and notices
        run: dockpipe --workflow site.sources
      - name: Build actual Qt renderer and documentation
        run: dockpipe --workflow site.build
      - name: Browser runtime and responsive rendering
        run: dockpipe --workflow site.test
      - name: Build and smoke-test the serving container
        run: dockpipe --workflow site.container
      - name: Audit exact serving image
        run: dockpipe --workflow site.audit
      - name: Retain qualified website assets
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-wasm-site-${{ matrix.environment }}
          path: bin/.local/site/
          if-no-files-found: error
          retention-days: 14
      - name: Retain browser verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-wasm-browser-evidence-${{ matrix.environment }}
          path: bin/.local/site-test/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain tested serving container
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-site-container-${{ matrix.environment }}
          path: bin/.local/site-container/
          if-no-files-found: error
          retention-days: 14
      - name: Retain corresponding Qt sources and relink materials
        if: matrix.environment == 'staging' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-corresponding-sources
          path: bin/.local/site-sources/
          if-no-files-found: error
          retention-days: 14
      - name: Retain container vulnerability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-site-audit-${{ matrix.environment }}
          path: |
            bin/.local/site-audit/vulnerabilities.json
            bin/.local/site-audit/verification.json
          if-no-files-found: warn
          retention-days: 14
