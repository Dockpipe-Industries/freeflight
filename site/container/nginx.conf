worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "FREEFLIGHT_ROBOTS" always;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location = / { limit_except GET { deny all; } try_files /index.html =404; }
        location ~ ^/(index\.html|review\.html|styles\.css|loader\.js|qtloader\.js|freeflight-site\.(js|wasm)|release\.json|robots\.txt|sitemap\.xml|NOTICES\.txt)$ {
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
